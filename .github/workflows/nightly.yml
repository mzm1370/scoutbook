name: Nightly full suite

on:
  schedule:
    # 03:00 UTC daily — inventory Part 9 / RFC 0037 safety net
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-full-suite
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full:
    name: Full test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Flaky quarantine check
        run: pnpm check:flaky

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
