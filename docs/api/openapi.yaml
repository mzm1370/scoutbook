info:
  title: Scoutbook API
  description: Scoutbook backend — structured decision records for PO/PM/Developer/QA teams. Auth uses
    JWT bearer tokens (1h). See docs/rfcs/0001-authentication.md.
  version: 0.1.0
  contact: {}
tags:
  - name: health
    description: Liveness checks
  - name: auth
    description: Registration, login, and current user
  - name: features
    description: Feature records (Idea → Release pipeline)
servers:
  - url: http://localhost:3000
    description: Local development
components:
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Paste the accessToken from POST /auth/login
  schemas:
    HealthResponseDto:
      type: object
      properties:
        status:
          type: string
          example: ok
      required:
        - status
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: dev@team.example
          format: email
        password:
          type: string
          example: password1
          minLength: 8
          format: password
        role:
          type: string
          enum:
            - PO
            - PM
            - DEVELOPER
            - QA
          example: DEVELOPER
      required:
        - email
        - password
        - role
    AuthUserDto:
      type: object
      properties:
        id:
          type: number
          example: 1
        email:
          type: string
          example: dev@team.example
        role:
          type: string
          enum:
            - PO
            - PM
            - DEVELOPER
            - QA
          example: DEVELOPER
      required:
        - id
        - email
        - role
    ErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        error:
          type: string
          example: Bad Request
        code:
          type: string
          example: VALIDATION_ERROR
          enum:
            - BAD_REQUEST
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - INTERNAL_ERROR
            - HTTP_ERROR
        message:
          type: string
          example: Validation failed
          description: Single human-readable message for UI display
        details:
          example:
            - title must be longer than or equal to 3 characters
          type: array
          items:
            type: string
        path:
          type: string
          example: /features
        timestamp:
          type: string
          example: 2026-09-15T07:00:00.000Z
        requestId:
          type: string
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      required:
        - statusCode
        - error
        - code
        - message
        - path
        - timestamp
    ApiFailureEnvelopeDto:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: "#/components/schemas/ErrorResponseDto"
      required:
        - success
        - error
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: dev@team.example
          format: email
        password:
          type: string
          example: password1
          minLength: 8
          format: password
      required:
        - email
        - password
    LoginResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: JWT access token (1h expiry)
        user:
          $ref: "#/components/schemas/AuthUserDto"
      required:
        - accessToken
        - user
    CreateFeatureDto:
      type: object
      properties:
        title:
          type: string
          example: GitHub Docs Sync
          maxLength: 200
        problem:
          type: string
          example: Decisions never land in the target repo docs/ folder.
          maxLength: 500
          description: One or two short sentences — enough to start, deepen later.
        riskTier:
          type: string
          enum:
            - P1
            - P2
            - P3
          example: P2
      required:
        - title
        - problem
        - riskTier
    FeatureResponseDto:
      type: object
      properties:
        id:
          type: number
          example: 1
        title:
          type: string
          example: GitHub Docs Sync
        problem:
          type: string
          example: Decisions never land in the target repo docs/ folder.
        riskTier:
          type: string
          enum:
            - P1
            - P2
            - P3
          example: P2
        currentStage:
          type: string
          enum:
            - IDEA
            - SCOUTING
            - RFC
            - RACI
            - IMPLEMENTATION
            - TESTING
            - REVIEW
            - RELEASE
          example: IDEA
        createdByUserId:
          type: number
          example: 1
        createdAt:
          type: string
          example: 2026-09-15T06:00:00.000Z
        updatedAt:
          type: string
          example: 2026-09-15T06:00:00.000Z
      required:
        - id
        - title
        - problem
        - riskTier
        - currentStage
        - createdByUserId
        - createdAt
        - updatedAt
    AdvanceFeatureStageDto:
      type: object
      properties:
        stage:
          type: string
          enum: &a23
            - IDEA
            - SCOUTING
            - RFC
            - RACI
            - IMPLEMENTATION
            - TESTING
            - REVIEW
            - RELEASE
          example: SCOUTING
          description: Must be the immediate next stage from the current one
      required:
        - stage
    FeatureStageHistoryResponseDto:
      type: object
      properties:
        id:
          type: number
          example: 1
        featureId:
          type: number
          example: 1
        fromStage:
          type: string
          enum: *a23
          nullable: true
          example: IDEA
        toStage:
          type: string
          enum: *a23
          example: SCOUTING
        changedByUserId:
          type: number
          example: 3
        createdAt:
          type: string
          example: 2026-09-30T10:00:00.000Z
      required:
        - id
        - featureId
        - fromStage
        - toStage
        - changedByUserId
        - createdAt
    ScoutingEntryResponseDto:
      type: object
      properties:
        id:
          type: number
          example: 1
        featureId:
          type: number
          example: 1
        question:
          type: string
          example: Who can create a Feature?
        currentState:
          type: string
          example: Only hallway discussion.
        expected:
          type: string
          example: PO only via POST /features.
        decision:
          type: string
          example: PO only
        status:
          type: string
          enum: &a24
            - READY
            - DECISION_REQUIRED
            - INVESTIGATING
            - BLOCKED
          example: READY
        createdAt:
          type: string
          example: 2026-09-22T12:00:00.000Z
        updatedAt:
          type: string
          example: 2026-09-22T12:00:00.000Z
      required:
        - id
        - featureId
        - question
        - currentState
        - expected
        - decision
        - status
        - createdAt
        - updatedAt
    CreateScoutingEntryDto:
      type: object
      properties:
        question:
          type: string
          example: Who can create a Feature?
          maxLength: 200
        currentState:
          type: string
          example: Only hallway discussion — no written rule.
          maxLength: 300
        expected:
          type: string
          example: PO only via POST /features.
          maxLength: 300
        decision:
          type: string
          example: PO only
          maxLength: 300
          description: Required when status is READY
        status:
          type: string
          enum: *a24
          example: INVESTIGATING
      required:
        - question
        - currentState
        - expected
    UpdateScoutingEntryDto:
      type: object
      properties:
        question:
          type: string
          maxLength: 200
        currentState:
          type: string
          maxLength: 300
        expected:
          type: string
          maxLength: 300
        decision:
          type: string
          maxLength: 300
        status:
          type: string
          enum: *a24
    DecisionNeededItemResponseDto:
      type: object
      properties:
        entryId:
          type: number
          example: 1
        featureId:
          type: number
          example: 1
        featureTitle:
          type: string
          example: GitHub Docs Sync
        featureStage:
          type: string
          enum: *a23
          example: SCOUTING
        riskTier:
          type: string
          enum:
            - P1
            - P2
            - P3
          example: P2
        question:
          type: string
          example: Allowed to sync draft RFCs?
        currentState:
          type: string
          example: Unknown
        expected:
          type: string
          example: PO decides
        decision:
          type: string
          example: ""
        status:
          type: string
          enum:
            - DECISION_REQUIRED
          example: DECISION_REQUIRED
        updatedAt:
          type: string
          example: 2026-09-30T10:00:00.000Z
      required:
        - entryId
        - featureId
        - featureTitle
        - featureStage
        - riskTier
        - question
        - currentState
        - expected
        - decision
        - status
        - updatedAt
    FeatureRfcCheckResponseDto:
      type: object
      properties:
        id:
          type: number
          example: 1
        featureId:
          type: number
          example: 1
        status:
          type: string
          enum: &a25
            - NOT_CHECKED
