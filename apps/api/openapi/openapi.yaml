openapi: 3.0.0
paths:
  /:
    get:
      operationId: getHello
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: string
                example: Hello World!
      summary: API root greeting
      tags: &a1
        - health
  /health:
    get:
      operationId: health
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponseDto"
      summary: Liveness probe
      tags: *a1
  /auth/register:
    post:
      operationId: register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserDto"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      summary: Register a new team member
      tags: &a2
        - auth
  /auth/login:
    post:
      operationId: login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseDto"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      summary: Login and receive a JWT access token
      tags: *a2
  /auth/me:
    get:
      operationId: me
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserDto"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
        - access-token: []
      summary: Return the authenticated user
      tags: *a2
info:
  title: Scoutbook API
  description: Scoutbook backend — structured decision records for PO/PM/Developer/QA teams. Auth uses
    JWT bearer tokens (1h). See docs/rfcs/0001-authentication.md.
  version: 0.1.0
  contact: {}
tags:
  - name: health
    description: Liveness checks
  - name: auth
    description: Registration, login, and current user
servers:
  - url: http://localhost:3000
    description: Local development
components:
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Paste the accessToken from POST /auth/login
  schemas:
    HealthResponseDto:
      type: object
      properties:
        status:
          type: string
          example: ok
      required:
        - status
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: dev@team.example
          format: email
        password:
          type: string
          example: password1
          minLength: 8
          format: password
        role:
          type: string
          enum:
            - PO
            - PM
            - DEVELOPER
            - QA
          example: DEVELOPER
      required:
        - email
        - password
        - role
    AuthUserDto:
      type: object
      properties:
        id:
          type: number
          example: 1
        email:
          type: string
          example: dev@team.example
        role:
          type: string
          enum:
            - PO
            - PM
            - DEVELOPER
            - QA
          example: DEVELOPER
      required:
        - id
        - email
        - role
    ErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        message:
          oneOf:
            - type: string
              example: Invalid credentials
            - type: array
              items:
                type: string
              example:
                - email must be an email
        error:
          type: string
          example: Bad Request
      required:
        - statusCode
        - message
        - error
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: dev@team.example
          format: email
        password:
          type: string
          example: password1
          minLength: 8
          format: password
      required:
        - email
        - password
    LoginResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: JWT access token (1h expiry)
        user:
          $ref: "#/components/schemas/AuthUserDto"
      required:
        - accessToken
        - user
